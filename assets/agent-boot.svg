<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { fill: #7ee787; fill-opacity: 1; }
        50% { fill: #7ee787; fill-opacity: 0.4; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(280px); }
      }

      .terminal-bg { fill: #0d1117; rx: 12; ry: 12; }
      .titlebar { fill: #161b22; }
      .titlebar-border { fill: none; stroke: #30363d; stroke-width: 1; }
      .btn-close { fill: #ff5f57; }
      .btn-min { fill: #febc2e; }
      .btn-max { fill: #28c840; }
      .title-text { fill: #8b949e; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 11px; }

      .prompt { fill: #7ee787; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; font-weight: 600; }
      .command { fill: #e6edf3; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; }
      .flag { fill: #d2a8ff; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; }
      .value { fill: #a5d6ff; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; }
      .arrow { fill: #f0883e; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; font-weight: 600; }
      .label { fill: #8b949e; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; }
      .module { fill: #79c0ff; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; }
      .success { fill: #7ee787; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; }
      .status-text { fill: #e6edf3; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 14px; font-weight: 600; }

      .line1 { opacity: 0; animation: fadeIn 0.4s ease-out 0.3s forwards; }
      .line2 { opacity: 0; animation: fadeIn 0.4s ease-out 1.0s forwards; }
      .line3 { opacity: 0; animation: fadeIn 0.4s ease-out 1.7s forwards; }
      .line4 { opacity: 0; animation: fadeIn 0.4s ease-out 2.4s forwards; }
      .line5 { opacity: 0; animation: fadeIn 0.4s ease-out 3.1s forwards; }

      .cursor {
        fill: #e6edf3;
        animation: blink 1s step-end infinite;
        animation-delay: 3.5s;
        opacity: 0;
      }
      .cursor-show {
        animation: fadeIn 0.1s ease-out 3.5s forwards, blink 1s step-end 3.6s infinite;
        opacity: 0;
      }

      .online-dot {
        animation: pulse 2s ease-in-out infinite;
        animation-delay: 3.1s;
      }

      .scanline {
        animation: scanline 4s linear infinite;
        opacity: 0.03;
      }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect class="terminal-bg" x="0" y="0" width="840" height="280" rx="12" ry="12"/>

  <!-- Subtle scanline effect -->
  <rect class="scanline" x="0" y="0" width="840" height="2" fill="#7ee787"/>

  <!-- Title bar -->
  <rect class="titlebar" x="0" y="0" width="840" height="36" rx="12" ry="12"/>
  <rect class="titlebar" x="0" y="12" width="840" height="24"/>
  <line x1="0" y1="36" x2="840" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Window buttons -->
  <circle class="btn-close" cx="20" cy="18" r="6"/>
  <circle class="btn-min" cx="40" cy="18" r="6"/>
  <circle class="btn-max" cx="60" cy="18" r="6"/>

  <!-- Title bar text -->
  <text class="title-text" x="420" y="22" text-anchor="middle">agent_system -- demario_asquitt</text>

  <!-- Line 1: Command -->
  <g class="line1">
    <text class="prompt" x="24" y="72">$</text>
    <text class="command" x="40" y="72">agent init</text>
    <text class="flag" x="132" y="72">--identity</text>
    <text class="value" x="243" y="72">"demario_asquitt"</text>
  </g>

  <!-- Line 2: Loading modules -->
  <g class="line2">
    <text class="arrow" x="24" y="108">&#9656;</text>
    <text class="label" x="40" y="108">loading:</text>
    <text class="module" x="120" y="108">research</text>
    <text class="label" x="195" y="108">&#183;</text>
    <text class="module" x="210" y="108">strategy</text>
    <text class="label" x="290" y="108">&#183;</text>
    <text class="module" x="305" y="108">orchestration</text>
    <text class="label" x="425" y="108">&#183;</text>
    <text class="module" x="440" y="108">execution</text>
  </g>

  <!-- Line 3: Connecting -->
  <g class="line3">
    <text class="arrow" x="24" y="144">&#9656;</text>
    <text class="label" x="40" y="144">agents:</text>
    <text class="success" x="110" y="144">12 specialized modules loaded</text>
    <text class="label" x="382" y="144">&#183;</text>
    <text class="success" x="397" y="144">all systems nominal</text>
  </g>

  <!-- Line 4: Mission -->
  <g class="line4">
    <text class="arrow" x="24" y="180">&#9656;</text>
    <text class="label" x="40" y="180">mission:</text>
    <text class="value" x="124" y="180">"build autonomous systems that think"</text>
  </g>

  <!-- Line 5: Status online -->
  <g class="line5">
    <text class="arrow" x="24" y="216">&#9656;</text>
    <text class="label" x="40" y="216">status:</text>
    <text class="status-text" x="110" y="216">online</text>
    <circle class="online-dot" cx="170" cy="212" r="4"/>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor-show" x="24" y="236" width="8" height="16" rx="1"/>

</svg>
